[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "contextos-core"
version = "0.2.0"
description = "Context scheduling for a fixed coding agent against a self-hosted vLLM server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "httpx>=0.28,<1", "numpy>=2,<3", "torch>=2.6,<3"]

[project.optional-dependencies]
live = ["transformers>=4.51", "sentence-transformers>=4", "datasets>=3"]

[project.scripts]
contextos = "contextos.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.14", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.build-backend]
module-name = "contextos"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B023", "B904"]

[tool.mypy]
python_version = "3.11"
files = ["src/contextos"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
